services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DATA_DIR: /data
      ATH_BACKUP_DIR: /backups
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_TRUSTED_PROXIES: ${DJANGO_TRUSTED_PROXIES:-}
    secrets:
      - django_secret_key
    volumes:
      - data:/data
      - backups:/backups

volumes:
  data:
  backups:

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key.txt
