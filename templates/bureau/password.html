{% extends "bureau/base_bureau.html" %}
{% block bureau_content %}
<h1>Changer le mot de passe du Bureau</h1>
<section class="card narrow">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Changer</button>
    <p class="muted">Toutes les sessions Bureau seront fermées, y compris celle-ci.</p>
  </form>
</section>
{% endblock %}
