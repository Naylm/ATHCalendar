{% if level == 'organizer' %}
<span class="exp-badge exp-organizer"{% if decorative %} aria-hidden="true" title="Habitué(e)"{% else %} role="img" aria-label="Habitué(e)" title="Habitué(e)"{% endif %}>Habitué(e)</span>
{% elif level == 'beginner' %}
<span class="exp-badge exp-beginner"{% if decorative %} aria-hidden="true" title="Débutant(e)"{% else %} role="img" aria-label="Débutant(e)" title="Débutant(e)"{% endif %}>Débutant(e)</span>
{% else %}
<span class="exp-badge exp-unknown"{% if decorative %} aria-hidden="true" title="Niveau à préciser"{% else %} role="img" aria-label="Niveau à préciser" title="Niveau à préciser"{% endif %}>À préciser</span>
{% endif %}
