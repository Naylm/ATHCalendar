{% if level == 'organizer' %}
<span class="exp-badge exp-organizer"{% if decorative %} aria-hidden="true" title="Habitué"{% else %} role="img" aria-label="Habitué" title="Habitué"{% endif %}>Habitué</span>
{% elif level == 'beginner' %}
<span class="exp-badge exp-beginner"{% if decorative %} aria-hidden="true" title="Débutant"{% else %} role="img" aria-label="Débutant" title="Débutant"{% endif %}>Débutant</span>
{% else %}
<span class="exp-badge exp-unknown"{% if decorative %} aria-hidden="true" title="Niveau à préciser"{% else %} role="img" aria-label="Niveau à préciser" title="Niveau à préciser"{% endif %}>À préciser</span>
{% endif %}
